<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业微信自动回复 · 本机演示</title>
<style>
  :root{
    --bg:#EDEDED; --panel:#FAFAFA; --card:#FFFFFF;
    --ink:#1A1A1A; --ink-2:#5A5A5A; --ink-3:#8C8C8C;
    --line:#E3E3E3; --line-2:#EFEFEF;
    --blue:#0082EF; --blue-dark:#0068C0;
    --green:#2E9E5B; --amber:#C98A0B; --red:#D0442F;
    --f-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --f-mono:"SF Mono","JetBrains Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--f-sans);
    font-size:14px;line-height:1.6;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    width:100%;max-width:520px;height:100%;background:var(--panel);
    display:flex;flex-direction:column;border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  /* 顶栏 */
  .top{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:12px 16px 10px;flex:none;
  }
  .top-row{display:flex;align-items:center;gap:9px}
  .logo{
    width:26px;height:26px;border-radius:6px;background:var(--blue);
    display:flex;align-items:center;justify-content:center;flex:none;
    color:#fff;font-size:13px;font-weight:600;
  }
  .title{font-size:14px;font-weight:640;letter-spacing:-.01em}
  .sub{font-size:11px;color:var(--ink-3);margin-left:auto;font-family:var(--f-mono)}

  .stats{
    display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;
  }
  .chip{
    font-family:var(--f-mono);font-size:10.5px;padding:3px 8px;
    border-radius:4px;background:#F3F3F3;color:var(--ink-2);
    display:flex;align-items:center;gap:5px;
  }
  .chip b{color:var(--ink);font-weight:600}
  .chip .d{width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
  .chip.ok .d{background:var(--green)}
  .chip.warn .d{background:var(--amber)}
  .chip.bad .d{background:var(--red)}
  .chip.mode{background:var(--blue);color:#fff}
  .chip.mode b{color:#fff}

  /* 消息区 */
  .feed{
    flex:1;overflow-y:auto;padding:16px 14px 8px;
    display:flex;flex-direction:column;gap:14px;
    scroll-behavior:smooth;
  }
  .feed::-webkit-scrollbar{width:5px}
  .feed::-webkit-scrollbar-thumb{background:#D6D6D6;border-radius:3px}

  .empty{
    margin:auto;text-align:center;color:var(--ink-3);font-size:12.5px;
    line-height:2;padding:20px;
  }
  .empty code{
    font-family:var(--f-mono);background:#F0F0F0;padding:1px 5px;
    border-radius:3px;font-size:11.5px;color:var(--ink-2);
  }

  .row{display:flex;gap:8px;align-items:flex-start;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .row.me{flex-direction:row-reverse}
  .av{
    width:30px;height:30px;border-radius:5px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:#fff;
  }
  .av.user{background:#9B9B9B}
  .av.bot{background:var(--blue)}

  .bubble-wrap{max-width:76%;display:flex;flex-direction:column;gap:4px}
  .row.me .bubble-wrap{align-items:flex-end}

  .bubble{
    padding:8px 12px;border-radius:6px;font-size:13.5px;line-height:1.65;
    word-break:break-word;white-space:pre-wrap;
  }
  .row.them .bubble{background:var(--card);border:1px solid var(--line-2)}
  .row.me .bubble{background:var(--blue);color:#fff}

  .meta{
    display:flex;gap:7px;align-items:center;flex-wrap:wrap;
    font-family:var(--f-mono);font-size:10px;color:var(--ink-3);
    padding:0 2px;
  }
  .meta .tag{
    padding:1px 5px;border-radius:3px;font-size:9.5px;letter-spacing:.03em;
  }
  .tag.sent{background:#E6F4EC;color:var(--green)}
  .tag.pending{background:#FAF0DC;color:var(--amber)}
  .tag.blocked{background:#FBEAE7;color:var(--red)}
  .tag.silent{background:#F0F0F0;color:var(--ink-3)}
  .why{color:var(--ink-3);font-size:10.5px;line-height:1.5}

  /* 系统提示（拦截/沉默） */
  .sys{
    align-self:center;font-size:11.5px;color:var(--ink-2);
    background:#F5F5F5;border:1px solid var(--line);border-radius:5px;
    padding:7px 12px;max-width:88%;text-align:center;line-height:1.6;
    animation:fade .22s ease;
  }
  .sys b{color:var(--red);font-weight:600}
  .sys.mute b{color:var(--ink-2)}
  .sys .sm{display:block;font-size:10px;color:var(--ink-3);margin-top:3px;
    font-family:var(--f-mono)}

  /* 正在输入 */
  .typing{display:flex;gap:4px;padding:10px 13px;background:var(--card);
    border:1px solid var(--line-2);border-radius:6px;width:fit-content}
  .typing i{
    width:5px;height:5px;border-radius:50%;background:#B8B8B8;
    animation:blink 1.1s infinite;
  }
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* 底部 */
  .bar{
    flex:none;background:var(--card);border-top:1px solid var(--line);
    padding:10px 12px 12px;
  }
  .quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
  .quick::-webkit-scrollbar{height:0}
  .quick button{
    flex:none;font-family:var(--f-sans);font-size:12px;
    padding:5px 11px;border-radius:14px;border:1px solid var(--line);
    background:#FAFAFA;color:var(--ink-2);cursor:pointer;
    transition:all .13s;
  }
  .quick button:hover{background:#F0F0F0;border-color:#D2D2D2;color:var(--ink)}

  .input-row{display:flex;gap:8px;align-items:flex-end}
  textarea{
    flex:1;font-family:var(--f-sans);font-size:13.5px;line-height:1.6;
    padding:9px 12px;border:1px solid var(--line);border-radius:6px;
    background:#FAFAFA;color:var(--ink);resize:none;outline:none;
    min-height:40px;max-height:110px;
  }
  textarea:focus{border-color:var(--blue);background:#fff}
  textarea::placeholder{color:#AEAEAE}

  .send{
    flex:none;width:auto;padding:9px 18px;height:40px;border:none;border-radius:6px;
    background:var(--blue);color:#fff;font-family:var(--f-sans);
    font-size:13.5px;font-weight:500;cursor:pointer;transition:background .13s;
  }
  .send:hover{background:var(--blue-dark)}
  .send:disabled{background:#C4C4C4;cursor:not-allowed}

  .foot{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:8px;font-family:var(--f-mono);font-size:10px;color:var(--ink-3);
  }
  .foot button{
    font-family:var(--f-sans);font-size:11px;color:var(--ink-3);
    background:none;border:none;cursor:pointer;padding:2px 4px;
  }
  .foot button:hover{color:var(--red)}

  @media(max-width:560px){
    .app{border:none;max-width:100%}
  }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="top-row">
      <div class="logo">企</div>
      <div class="title">小陆 · 露营装备</div>
      <div class="sub" id="modeLabel">—</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="feed" id="feed">
    <div class="empty" id="empty">
      在下面打一句话，会自动回复。<br>
      这几句能看出不同结局：<br>
      <code>在吗</code> <code>多少钱</code> <code>能便宜点吗</code> <code>我要退款</code> <code>嗯</code>
    </div>
  </div>

  <div class="bar">
    <div class="quick" id="quick">
      <button data-t="在吗">在吗</button>
      <button data-t="这个桌子多少钱">多少钱</button>
      <button data-t="原木色有现货吗">有现货吗</button>
      <button data-t="什么时候能发">什么时候发</button>
      <button data-t="可以开票吗">能开票吗</button>
      <button data-t="能便宜点吗">能便宜点吗</button>
      <button data-t="我要退款">我要退款</button>
      <button data-t="嗯">嗯</button>
    </div>
    <div class="input-row">
      <textarea id="box" rows="1" placeholder="输入消息，回车发送"></textarea>
      <button class="send" id="btnSend">发送</button>
    </div>
    <div class="foot">
      <span id="foot-left">本机模拟 · 走真实加密与签名</span>
      <button id="btnReset">清空对话</button>
    </div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const feed = $('feed');
const box = $('box');

let SEQ = 0;
let busy = false;
let typingEl = null;

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function atBottom() {
  return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90;
}

function scrollDown(force) {
  if (force) feed.scrollTop = feed.scrollHeight;
}

function addUser(item) {
  const el = document.createElement('div');
  el.className = 'row me';
  el.innerHTML =
    `<div class="av user">客</div>
     <div class="bubble-wrap">
       <div class="bubble">${esc(item.text)}</div>
       <div class="meta"><span>${item.at}</span></div>
     </div>`;
  feed.appendChild(el);
}

const TAG_TEXT = {
  sent: '已自动回复',
  pending: '待人工确认',
  blocked: '已拦截',
  silent: '不回复',
  no_draft: '无草稿',
};

function addBot(item) {
  const final = item.final || '';
  // 拦截和沉默不产生气泡——真实场景里根本不会发出去。
  // 用一条系统提示代替，这样"没回"也能被看见原因。
  if (final === 'blocked' || final === 'silent' || final === 'no_draft') {
    const el = document.createElement('div');
    el.className = 'sys' + (final === 'blocked' ? '' : ' mute');
    const label = final === 'blocked' ? '拦截' :
                  (final === 'silent' ? '不回复' : '未生成草稿');
    el.innerHTML =
      `<b>${label}</b>　${esc(item.why)}` +
      `<span class="sm">${esc(item.replies_to)}　${item.at}` +
      (item.ms != null ? `　${item.ms}ms` : '') + `</span>`;
    feed.appendChild(el);
    return;
  }

  const tag = TAG_TEXT[final] || final || '未知';
  const conf = item.necessity != null
    ? `置信度 ${Number(item.necessity).toFixed(2)}` : '';
  const el = document.createElement('div');
  el.className = 'row them';
  el.innerHTML =
    `<div class="av bot">AI</div>
     <div class="bubble-wrap">
       <div class="bubble">${esc(item.text || '（空）')}</div>
       <div class="meta">
         <span class="tag ${esc(final)}">${esc(tag)}</span>
         <span>${item.at}</span>
         ${item.ms != null ? `<span>${item.ms}ms</span>` : ''}
         ${conf ? `<span>${esc(conf)}</span>` : ''}
       </div>
       <div class="why">${esc(item.why)}</div>
     </div>`;
  feed.appendChild(el);
}

function showTyping() {
  if (typingEl) return;
  typingEl = document.createElement('div');
  typingEl.className = 'row them';
  typingEl.innerHTML =
    `<div class="av bot">AI</div>
     <div class="bubble-wrap"><div class="typing"><i></i><i></i><i></i></div></div>`;
  feed.appendChild(typingEl);
  scrollDown(true);
}

function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function renderStats(s) {
  const parts = [];
  parts.push(`<span class="chip mode">${esc(s.mode)}</span>`);
  if (s.stats.sent) parts.push(
    `<span class="chip ok"><span class="d"></span>自动回复 <b>${s.stats.sent}</b></span>`);
  if (s.stats.pending) parts.push(
    `<span class="chip warn"><span class="d"></span>待确认 <b>${s.stats.pending}</b></span>`);
  if (s.stats.blocked) parts.push(
    `<span class="chip bad"><span class="d"></span>拦截 <b>${s.stats.blocked}</b></span>`);
  if (s.stats.silent) parts.push(
    `<span class="chip"><span class="d"></span>不回复 <b>${s.stats.silent}</b></span>`);
  if (s.stats.avg_ms) parts.push(
    `<span class="chip">平均 <b>${s.stats.avg_ms}</b> ms</span>`);
  $('stats').innerHTML = parts.join('');
  $('modeLabel').textContent = s.url_ok ? '回调已验证' : '回调未验证';
}

async function poll() {
  try {
    const r = await fetch(`/api/state?since=${SEQ}`, {cache: 'no-store'});
    const s = await r.json();
    renderStats(s);

    if (s.items.length) {
      const wasBottom = atBottom();
      hideTyping();
      $('empty')?.remove();
      for (const item of s.items) {
        if (item.role === 'user') addUser(item);
        else addBot(item);
        SEQ = Math.max(SEQ, item.seq);
      }
      // 用户还在看历史时不强行拽到底部
      if (wasBottom || s.items.some(i => i.role === 'bot')) scrollDown(true);
    } else if (busy) {
      showTyping();
    }
  } catch (e) { /* 服务重启时的空窗，下一轮会补上 */ }
}

async function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  busy = true;
  $('btnSend').disabled = true;
  try {
    await fetch('/api/say', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
    setTimeout(poll, 60);
  } finally {
    busy = false;
    $('btnSend').disabled = false;
    box.focus();
  }
}

$('btnSend').addEventListener('click', () => {
  const t = box.value;
  box.value = '';
  box.style.height = 'auto';
  send(t);
});

box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    $('btnSend').click();
  }
});

box.addEventListener('input', () => {
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 110) + 'px';
});

$('quick').addEventListener('click', e => {
  const t = e.target.dataset?.t;
  if (t) send(t);
});

$('btnReset').addEventListener('click', async () => {
  await fetch('/api/reset', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
  feed.innerHTML = '';
  SEQ = 0;
  hideTyping();
  const d = document.createElement('div');
  d.className = 'empty';
  d.id = 'empty';
  d.innerHTML = '对话已清空。在下面打一句话试试。';
  feed.appendChild(d);
  poll();
});

// 轮询比处理节奏快一点，回复出现得更干脆
setInterval(poll, 500);
poll();
box.focus();
</script>
</body>
</html>
