name: build

# 不用 paths 过滤：path 过滤和 tag 触发同时存在时会互相吞噬，
# 表现为「打了 tag 却没构建」，而且极难排查。宁可多跑几次。
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    # 固定 22.04 而不是 ubuntu-latest：后者会随镜像迁移漂移，
    # 预装的 Android SDK 版本不确定。构建机不该跟着镜像走。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 runner 镜像自带的 Android SDK（licenses 已接受），
      # 不用第三方 setup-android action —— 少一个依赖就少一处会坏的地方。
      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: Ensure platform 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$MGR" ]; then
            "$MGR" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 \
              || echo "sdkmanager 装包失败，交给 AGP 自己处理"
          else
            echo "镜像里没有 sdkmanager，交给 AGP 自己处理"
          fi

      - name: Install Gradle 8.2
        run: |
          set -euo pipefail
          curl -sSL --retry 3 https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.2/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-dist/gradle-8.2/bin/gradle" --version

      # 签名：
      #  - 仓库配了 KEYSTORE_B64 → 用固定密钥，包可以覆盖安装（正式路径）
      #  - 没配 → 现场生成一把临时密钥，只为让 CI 能出包验证编译
      #    临时密钥每次不同，所以那个包只能装一次，不能覆盖升级。
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          PASS="${KEYSTORE_PASS:-autoreply-test-2026}"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/autoreply.p12"
            echo "使用仓库 Secrets 里的固定密钥"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次用临时密钥出包（不可覆盖安装）"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/autoreply.p12" -storetype PKCS12 \
              -alias autoreply -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=AutoReply, OU=Dev, O=AutoReply, L=NA, C=CN" > /dev/null
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/autoreply.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: autoreply-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success'
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.apk
          body_path: RELEASE_NOTES.md
