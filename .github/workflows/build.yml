name: build

# 不用 paths 过滤：path 过滤和 tag 触发同时存在时会互相吞噬，
# 表现为「打了 tag 却没构建」，而且极难排查。宁可多跑几次。
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 刻意设为 false。
  # 原来用 true 时，触发第二次会把正在跑的第一次掐掉，日志里只留一句
  # 「Canceling since a higher priority waiting request exists」——
  # 看起来像构建失败，实际是并发策略，排查时很容易误判成代码问题。
  # 单人项目宁可排队多跑一次，也不要"跑到一半被取消"这种假失败。
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    # 固定 22.04 而不是 ubuntu-latest：后者会随镜像迁移漂移，
    # 预装的 Android SDK 版本不确定。构建机不该跟着镜像走。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 runner 镜像自带的 Android SDK（licenses 已接受），
      # 不用第三方 setup-android action —— 少一个依赖就少一处会坏的地方。
      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: Ensure platform 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$MGR" ]; then
            "$MGR" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 \
              || echo "sdkmanager 装包失败，交给 AGP 自己处理"
          else
            echo "镜像里没有 sdkmanager，交给 AGP 自己处理"
          fi

      - name: Install Gradle 8.2
        run: |
          set -euo pipefail
          curl -sSL --retry 3 https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.2/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-dist/gradle-8.2/bin/gradle" --version

      # 签名：
      #  - 仓库配了 KEYSTORE_B64 → 用固定密钥，包可以覆盖安装（正式路径）
      #  - 没配 → 现场生成一把临时密钥，只为让 CI 能出包验证编译
      #    临时密钥每次不同，所以那个包只能装一次，不能覆盖升级。
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          PASS="${KEYSTORE_PASS:-autoreply-test-2026}"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/autoreply.p12"
            echo "使用仓库 Secrets 里的固定密钥"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次用临时密钥出包（不可覆盖安装）"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/autoreply.p12" -storetype PKCS12 \
              -alias autoreply -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=AutoReply, OU=Dev, O=AutoReply, L=NA, C=CN" > /dev/null
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/autoreply.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"

          # 输出签名指纹，写进 Step Summary。
          #
          # 为什么值得单独做一步：签名不一致时，手机只会说"已安装"然后失败，
          # 报错信息完全不提签名。有了指纹，每次构建都能和上一次对比 ——
          # 一致说明能覆盖安装，不一致一眼看出是哪次开始变的。
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/autoreply.p12" \
                 -storepass "$PASS" 2>/dev/null \
               | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//' || true)
          echo "签名指纹: $FP"
          {
            echo "### 签名"
            echo ""
            echo "- 来源：$( [ -n "${KEYSTORE_B64:-}" ] && echo '仓库 Secrets（固定密钥）' || echo '临时生成（不可覆盖安装）' )"
            echo "- SHA256：\`$FP\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        env:
          # 打 tag 出正式包时用 tag 名；平时每次构建都带 run_number。
          # run_number 必须进 versionName —— 否则手机上几个包版本号长得一样，
          # 装完分不清哪个是新的。
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-dev.{0}', github.run_number) }}
          # versionCode 单调递增是关键：相同 versionCode 的包，系统只提示
          # 「已安装相同版本」而不当作升级，用户会以为装不上。
          APP_VERSION_CODE: ${{ github.run_number }}
        # 出 release 而不是 debug：debug 包带 android:debuggable，
        # 别人装上等于给了一个可挂调试器的进程，也没必要。release 更小、
        # 更接近"正常应用"。混淆是关的（isMinifyEnabled = false），
        # 所以崩溃栈依然可读，不影响排查。
        #
        # tee 存一份日志，供失败时提取错误；pipefail 保证 gradle 退出码不被管道吞掉。
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # 把编译器真正的错误（e: 开头那几行）提到页面顶部。
      # 不加这一步，失败时要在几千行日志里往上翻，而且很容易翻错段落 ——
      # 初次排查时就在这上面浪费了两轮。
      - name: Summarize build errors
        if: failure()
        # tee -a 同时写进 Step Summary 和本步骤的输出。
        # 只写 Summary 的话用户还得去找那个区块；写到 stdout 后，
        # 日志最后几行直接就是错误，翻都不用翻。
        run: |
          {
            echo '## 构建失败：编译器输出'
            echo ''
            echo '```'
            grep -E '^e: |^\* What went wrong|^> [A-Z]' /tmp/build.log | head -40 \
              || echo '（没匹配到 e: 行，请展开上面的完整日志）'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: autoreply-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success'
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.apk
          body_path: RELEASE_NOTES.md
